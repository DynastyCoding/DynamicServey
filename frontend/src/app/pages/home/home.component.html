@if (surveys().length > 0) {
  <div class="card-grid">
    @for (survey of surveys(); track survey.id) {
      <mat-card class="survey-card">
        <mat-card-header>
          <mat-card-title class="card-title">{{
            survey.title
          }}</mat-card-title>
          <mat-card-subtitle class="card-subtitle">開放至 {{ survey.endDate }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content class="card-content">
          <p class="card-description line-clamp-3">
            {{ survey.description || "本問卷尚無詳細說明。" }}
          </p>
        </mat-card-content>
        <mat-card-actions class="card-actions">
          <button
            mat-raised-button
            color="primary"
            [routerLink]="['/fill', survey.id]"
          >
            立即填寫 <mat-icon>edit_note</mat-icon>
          </button>
        </mat-card-actions>

        <!-- surveys() 為空時顯示 -->
        @if (surveys().length === 0) {
          <div class="empty-state">
            <p class="empty-state-text">目前沒有進行中的問卷，請稍後再來。</p>
          </div>
        }
      </mat-card>
    }
  </div>
}
