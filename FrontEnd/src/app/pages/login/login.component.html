<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>登入</mat-card-title>
    </mat-card-header>

    <!-- 重點：表單內容要包在 mat-card-content 裡面 -->
    <mat-card-content>
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="login-form"
      >
        <!-- Email 輸入框 -->
        <mat-form-field appearance="outline">
          <mat-label>電子郵件 (Email)</mat-label>
          <input matInput formControlName="email" type="email" />
          @if (loginForm.get("email")?.hasError("email")) {
            <mat-error>請輸入有效的 Email 格式</mat-error>
          }
        </mat-form-field>

        <!-- 密碼輸入框 -->
        <mat-form-field appearance="outline">
          <mat-label>密碼 (Password)</mat-label>
          <input matInput formControlName="password" type="password" />
          @if (loginForm.get("password")?.hasError("minlength")) {
            <mat-error>密碼長度需至少 6 位</mat-error>
          }
        </mat-form-field>

        <!-- 登入按鈕 -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          登入
        </button>

        <!-- 註冊連結 -->
        <div class="login-links">
          還沒有帳號？<a routerLink="/register">立即註冊</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
