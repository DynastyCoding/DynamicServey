<div class="survey-responses-container">
  <!-- 標題 -->
  <h1 class="page-title">我的填答紀錄</h1>

  <!-- 表格卡片 -->
  <div class="responses-card">
    <table mat-table [dataSource]="responses()" class="responses-table">
      <!-- 編號欄位 -->
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>編號</th>
        <td mat-cell *matCellDef="let r; let i = index">#{{ i + 1 }}</td>
      </ng-container>

      <!-- 問卷標題欄位 -->
      <ng-container matColumnDef="surveyTitle">
        <th mat-header-cell *matHeaderCellDef>問卷標題</th>
        <td mat-cell *matCellDef="let r">{{ r.surveyTitle }}</td>
      </ng-container>

      <!-- 填寫時間欄位 -->
      <ng-container matColumnDef="submittedAt">
        <th mat-header-cell *matHeaderCellDef>填寫時間</th>
        <td mat-cell *matCellDef="let r">
          {{ r.submittedAt | date: "yyyy-MM-dd HH:mm" }}
        </td>
      </ng-container>

      <!-- 操作欄位 -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">查看回覆</th>
        <td mat-cell *matCellDef="let r" class="actions-cell">
          <a
            [routerLink]="['/history', r.responseId]"
            class="history-link"
          >
            前往
          </a>
        </td>
      </ng-container>

      <!-- 表頭列 -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- 資料列 -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- 無資料時的提示列 -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-message" colspan="4">目前沒有填答紀錄。</td>
      </tr>
    </table>
  </div>

  <!-- 返回按鈕 -->
  <div class="return-button-container">
    <button mat-stroked-button routerLink="/">返回首頁</button>
  </div>
</div>
