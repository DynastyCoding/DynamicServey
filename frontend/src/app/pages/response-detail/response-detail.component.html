<div class="response-detail-container">
  @if (detail()) {
    <mat-card class="response-card">
      <h1 class="response-title">{{ detail().surveyTitle }}</h1>
      <p class="response-time">
        提交時間：{{ detail().submittedAt | date: "yyyy-MM-dd HH:mm" }}
      </p>

      <div class="details-container">
        @for (d of detail().details; track $index) {
          <div class="detail-item">
            <p class="detail-question">
              {{ $index + 1 }}. {{ d.questionTitle }}
            </p>
            <p class="detail-answer">{{ d.answer || "(未作答)" }}</p>
          </div>
        }
      </div>
      <div class="action-container">
        <button mat-stroked-button routerLink="/history">返回我的紀錄</button>
      </div>
    </mat-card>
  } @else {
    <p class="loading-message">正在讀取作答內容...</p>
  }
</div>
