<div class="p-6 max-w-3xl mx-auto">
  <!-- 標題 -->
  <h1 class="text-2xl font-bold text-gray-800 mb-6">我的填答紀錄</h1>

  <!-- 表格卡片 -->
  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table mat-table [dataSource]="responses()" class="w-full">
      <!-- 編號欄位 -->
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef>編號</th>
        <td mat-cell *matCellDef="let r; let i = index">#{{ i + 1 }}</td>
      </ng-container>

      <!-- 問卷標題欄位 -->
      <ng-container matColumnDef="surveyTitle">
        <th mat-header-cell *matHeaderCellDef>問卷標題</th>
        <td mat-cell *matCellDef="let r">{{ r.surveyTitle }}</td>
      </ng-container>

      <!-- 填寫時間欄位 -->
      <ng-container matColumnDef="submittedAt">
        <th mat-header-cell *matHeaderCellDef>填寫時間</th>
        <td mat-cell *matCellDef="let r">
          {{ r.submittedAt | date: "yyyy-MM-dd HH:mm" }}
        </td>
      </ng-container>

      <!-- 操作欄位 -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right">查看回覆</th>
        <td mat-cell *matCellDef="let r" class="text-right">
          <a
            [routerLink]="['/history', r.responseId]"
            class="text-indigo-600 hover:underline"
          >
            前往
          </a>
        </td>
      </ng-container>

      <!-- 表頭列 -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- 資料列 -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- 無資料時的提示列 -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell p-8 text-center" colspan="4">目前沒有填答紀錄。</td>
      </tr>
    </table>
  </div>

  <!-- 返回按鈕 -->
  <div class="flex justify-center mt-6">
    <button mat-stroked-button routerLink="/">返回首頁</button>
  </div>
</div>
