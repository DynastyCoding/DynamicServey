<!-- 使用 position: relative 作為定位基準 -->
<mat-toolbar class="cyber-navbar">
  <!-- 左邊：Logo -->
  <div class="navbar-logo" routerLink="/">
    <mat-icon>assignment</mat-icon>
    <span>動態問卷系統</span>
  </div>

  <!-- 右邊區塊：使用 position: absolute 強制定位在最右邊 -->
  <div class="navbar-actions">
    <button
      mat-button
      routerLink="/surveys"
    >
      問卷查詢
    </button>

    @if (authService.currentUser()) {
      <button
        mat-button
        routerLink="/admin"
      >
        問卷管理
      </button>
      <button
        mat-button
        routerLink="/history"
      >
        我的紀錄
      </button>

      <span>歡迎, {{ authService.currentUser()?.name }}</span>

      <button
        mat-stroked-button
        (click)="logout()"
      >
        登出
      </button>
    } @else {
      <button
        mat-button
        routerLink="/login"
      >
        登入
      </button>
      <button
        mat-raised-button
        routerLink="/register"
      >
        註冊
      </button>
    }
  </div>
</mat-toolbar>
